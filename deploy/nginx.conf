# Reverse proxy for the Online Exam Portal (OEP-SR-001).
# Replace exam-portal.example.edu, the certificate paths and the static
# files path before use.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name exam-portal.example.edu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exam-portal.example.edu;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Anything below TLS 1.2 is refused during the handshake.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Bulk question import accepts files up to 5 MB (MAX_IMPORT_FILE_SIZE in
    # question_bank/views.py). nginx's default of 1 MB would reject larger
    # files before Django sees them.
    client_max_body_size 5m;

    # Files gathered by `python manage.py collectstatic` (STATIC_ROOT).
    # Replace the path with the project's location on the server.
    location /static/ {
        alias /srv/exam-portal/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Django records the last address in this list in audit logs.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always overwrite this header: Django trusts it to detect HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Reverse proxy for the Online Exam Portal (OEP-SR-001).
# Replace exam-portal.example.edu and the certificate paths before use.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name exam-portal.example.edu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name exam-portal.example.edu;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Anything below TLS 1.2 is refused during the handshake.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite this header: Django trusts it to detect HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

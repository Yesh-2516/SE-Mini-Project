name: Django CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Run pytest with coverage
        run: python -m pytest --cov=accounts --cov=courses --cov=exam_management --cov=question_bank --cov=exam_delivery --cov-report=term-missing
